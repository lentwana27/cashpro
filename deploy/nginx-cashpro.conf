# Install: cp deploy/nginx-cashpro.conf /etc/nginx/sites-available/cashpro
#          ln -s /etc/nginx/sites-available/cashpro /etc/nginx/sites-enabled/cashpro
#          nginx -t && systemctl reload nginx
# The ssl_certificate lines were added by certbot; re-run
# `certbot --nginx -d cashpro.mineazy.com` after a fresh install to reissue them.
server {
    server_name cashpro.mineazy.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cashpro.mineazy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cashpro.mineazy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cashpro.mineazy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name cashpro.mineazy.com;

    listen 80;
    return 404; # managed by Certbot


}